
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niveau à bulle</title>
<style>
body {
    background: #17191f;
    color: white;
    font-family: Arial;
    text-align: center;
}
.level {
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: #303741;
    border: 5px solid #858d98;
    margin: 35px auto;
    position: relative;
}
.bubble {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, white, #42caff 60%);
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 15px #42caff;
}
select, button {
    padding: 12px;
    border-radius: 8px;
    font-size: 16px;
}
</style>
</head>
<body>

<h2>Niveau à bulle</h2>

<select id="axis">
    <option value="x">Axe X (gauche / droite)</option>
    <option value="y">Axe Y (avant / arrière)</option>
    <option value="xy">Deux axes</option>
</select>

<div class="level">
    <div class="bubble" id="bubble"></div>
</div>

<p id="values">X: 0° | Y: 0°</p>
<button onclick="start()">Activer les capteurs</button>

<script>
let gamma = 0;
let beta = 0;

function update() {
    const axis = document.getElementById("axis").value;

    let x = axis === "y" ? 0 : gamma;
    let y = axis === "x" ? 0 : beta;

    x = Math.max(-45, Math.min(45, x));
    y = Math.max(-45, Math.min(45, y));

    const bubble = document.getElementById("bubble");

    bubble.style.left = (50 + x / 45 * 40) + "%";
    bubble.style.top = (50 + y / 45 * 40) + "%";

    document.getElementById("values").textContent =
        `X: ${gamma.toFixed(1)}° | Y: ${beta.toFixed(1)}°`;
}

async function start() {
    if (typeof DeviceOrientationEvent.requestPermission === "function") {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== "granted") return;
    }

    window.addEventListener("deviceorientation", event => {
        if (event.gamma === null || event.beta === null) return;
        gamma = event.gamma;
        beta = event.beta;
        update();
    });
}

document.getElementById("axis").addEventListener("change", update);
</script>

</body>
</html>
