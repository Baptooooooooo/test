
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test capteurs</title>
<style>
body {
    background: #17191f;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 20px;
}
#status { color: orange; }
#bubble {
    width: 60px;
    height: 60px;
    background: #42caff;
    border-radius: 50%;
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 15px #42caff;
}
.level {
    width: 300px;
    height: 90px;
    background: #333;
    border: 4px solid #888;
    border-radius: 50px;
    position: relative;
    margin: 40px auto;
}
</style>
</head>
<body>

<h2>Test inclinaison</h2>
<p id="status">En attente...</p>

<div class="level">
    <div id="bubble"></div>
</div>

<h3>Valeurs des capteurs</h3>
<p>Alpha : <span id="a">-</span></p>
<p>Beta : <span id="b">-</span></p>
<p>Gamma : <span id="g">-</span></p>

<button onclick="start()">Activer les capteurs</button>

<script>
async function start() {
    const status = document.getElementById("status");

    try {
        if (!window.DeviceOrientationEvent) {
            status.textContent = "Capteurs non supportés";
            return;
        }

        if (typeof DeviceOrientationEvent.requestPermission === "function") {
            const permission =
                await DeviceOrientationEvent.requestPermission();

            if (permission !== "granted") {
                status.textContent = "Permission refusée";
                return;
            }
        }

        window.addEventListener("deviceorientation", (e) => {
            if (e.gamma === null) {
                status.textContent = "Aucune donnée reçue";
                return;
            }

            status.textContent = "Capteurs connectés !";

            document.getElementById("a").textContent = e.alpha?.toFixed(1);
            document.getElementById("b").textContent = e.beta?.toFixed(1);
            document.getElementById("g").textContent = e.gamma.toFixed(1);

            let angle = Math.max(-45, Math.min(45, e.gamma));

            document.getElementById("bubble").style.left =
                (50 + angle / 45 * 40) + "%";
        });

        status.textContent = "En attente des données...";
    } catch (error) {
        status.textContent = "Erreur : " + error.message;
    }
}
</script>

</body>
</html>
